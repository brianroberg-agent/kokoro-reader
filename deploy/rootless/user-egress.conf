# A drop-in for the narration account's systemd user manager, installed by root as
# /etc/systemd/system/user@<the account's uid>.service.d/svc-egress.conf. Fail-closed:
# the manager, and every container it runs, starts only after the account's egress table
# is in, and stops if svc-egress@narration.service stops (docs/pipeline.md).

[Unit]
Requires=svc-egress@narration.service
After=svc-egress@narration.service
